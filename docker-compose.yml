services:
  ai-cv-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cvmaker-ai-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
